# Application
spring.application.name=binancepricetracker
logging.file.name=logs/binance-price-tracker.log

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/binance_prices}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true

# Binance scheduler settings
binance.symbol=${BINANCE_SYMBOL:BNBUSDT}
binance.poll-interval=${BINANCE_POLL_INTERVAL:PT30S}
